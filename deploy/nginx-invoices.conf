server {
    listen 80;
    server_name 192.168.3.117;
    client_max_body_size 16m;
    location = / { return 302 /invoices; }
    location = /invoices { include /etc/nginx/invoice-proxy.conf; }
    location /invoice-static/ { include /etc/nginx/invoice-proxy.conf; }
    location = /api/invoices { include /etc/nginx/invoice-proxy.conf; }
    location /api/invoices/ { include /etc/nginx/invoice-proxy.conf; }
    location /api/invoice-auth/ { include /etc/nginx/invoice-proxy.conf; }
    location / { return 404; }
}
